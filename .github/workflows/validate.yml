# Two independent, standard install paths must both keep working: this repo's own
# `npx blender-skill` (bin/install.js) and the community skills.sh registry's
# `npx skills add kajisho5/blender-skill` / `gh skill install kajisho5/blender-skill
# blender-skill` (GitHub CLI 2.90+) -- all three read SKILL.md's frontmatter, so a malformed
# frontmatter or a name mismatch (directory name / package.json name / frontmatter name must all
# agree) breaks discovery silently rather than with a clear error, if this doesn't catch it first.
name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  skill-frontmatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: pip install --quiet --disable-pip-version-check pyyaml

      # A hand-rolled "key: value" line splitter here once let a real YAML syntax error (an
      # unescaped apostrophe inside a single-quoted scalar -- "Blender's own MCP add-on") through
      # silently; only actually running `npx skills add . --list` against it caught that it
      # couldn't parse SKILL.md at all. Use a real YAML parser so this step can't repeat that.
      - name: SKILL.md frontmatter is well-formed YAML with name/description
        run: |
          python3 - <<'PY'
          import re, sys, json, pathlib
          import yaml

          text = open("SKILL.md", encoding="utf-8").read()
          m = re.match(r"^---\n(.*?)\n---\n", text, re.S)
          if not m:
              sys.exit("SKILL.md has no --- frontmatter block")
          fields = yaml.safe_load(m.group(1))
          if not isinstance(fields, dict):
              sys.exit("SKILL.md frontmatter did not parse to a mapping")
          for required in ("name", "description"):
              if not fields.get(required):
                  sys.exit(f"SKILL.md frontmatter is missing '{required}'")

          pkg = json.load(open("package.json", encoding="utf-8"))
          dir_name = pathlib.Path(".").resolve().name
          if fields["name"] != pkg["name"]:
              sys.exit(f"SKILL.md name '{fields['name']}' != package.json name '{pkg['name']}'")
          print(f"ok: name={fields['name']!r} matches package.json (directory: {dir_name})")
          PY

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: npx skills add . --list finds exactly this skill
        run: |
          if npx --yes skills add . --list > /tmp/skills-list.txt 2>&1; then
            cat /tmp/skills-list.txt
            grep -q "blender-skill" /tmp/skills-list.txt || { echo "::error::'skills add . --list' did not list blender-skill"; exit 1; }
          else
            echo "::warning::'npx skills add . --list' failed (skills.sh registry unavailable or CLI changed) -- not failing the build on a third-party registry's own availability"
            cat /tmp/skills-list.txt || true
          fi

      - run: node bin/install.js --dir /tmp/skills-check
      - run: test -f /tmp/skills-check/blender-skill/SKILL.md
