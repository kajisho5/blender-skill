# Static analysis for the languages this repo ships: Python (scripts/) and JavaScript
# (bin/install.js). Runs on every PR/push to main plus a weekly schedule so a query-pack
# update can surface something new in code nobody touched recently.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 7 * * 1"   # Mondays

# See ci.yml's identical block for why: a superseded run's result is thrown away anyway, so
# cancelling it saves real Actions minutes rather than just finishing a run nobody will read.
concurrency:
  # a newer commit on a pull request cancels the runs of the commit it replaces; every other run (main, schedule,
  # manual) has its own group and is never cancelled
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript]
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
