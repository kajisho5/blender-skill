# Weekly: check download.blender.org for a Blender major/minor this repo doesn't know about yet
# (references/blender-versions.md and ci.yml's own matrix), and open an issue if there's a gap --
# never add it to the CI matrix automatically. A new Blender version can change bpy operator
# behavior (scripts/bpy/_compat.py exists for exactly that), so adding it to the tested matrix is
# a decision that needs a human to actually run the suite against it first, not something this
# cron should do unattended.
name: blender-versions

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compare download.blender.org's releases against references/blender-versions.md
        id: check
        run: |
          python3 - <<'PY'
          import re, urllib.request

          req = urllib.request.Request("https://download.blender.org/release/", headers={"User-Agent": "blender-skill-ci/1.0"})
          html = urllib.request.urlopen(req, timeout=30).read().decode()

          def key(v):
              return tuple(int(p) for p in v.split("."))

          remote = sorted(set(re.findall(r'Blender(\d+\.\d+)/', html)), key=key)

          known_text = open("references/blender-versions.md", encoding="utf-8").read()
          known = set(re.findall(r'\b(\d+\.\d+)\b', known_text))

          # Only ever flag a release *newer* than everything already tracked -- a blind set
          # difference would also "discover" every historical version back to 1.0 that simply
          # isn't mentioned in blender-versions.md's short table, which is not what this cron is
          # for (catching a new release going forward, not auditing decades of old ones).
          floor = max((key(v) for v in known), default=(0, 0))
          missing = [v for v in remote if v not in known and key(v) > floor]
          print("remote (newest 5):", remote[-5:])
          print("known:", sorted(known))
          print("floor:", floor)
          print("missing:", missing)
          with open("missing.txt", "w") as f:
              f.write("\n".join(missing))
          PY

      - name: Open an issue for each version not yet tracked (skip if one already exists)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          while read -r version; do
            [ -z "$version" ] && continue
            title="Blender $version is available upstream"
            if gh issue list --search "in:title \"$title\"" --json title --jq '.[].title' | grep -qF "$title"; then
              echo "issue already exists for $version"
              continue
            fi
            gh issue create --title "$title" \
              --label blender-version \
              --body "download.blender.org lists a Blender $version release not yet in references/blender-versions.md or ci.yml's test matrix. This does not mean anything is broken -- it means nobody has run this skill's suite against it yet. See .claude/skills or CONTRIBUTING.md for how to add it once verified."
          done < missing.txt
